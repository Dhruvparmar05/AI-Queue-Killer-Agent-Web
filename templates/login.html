<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Killer - Login / Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; min-height: 100vh; display: flex; align-items: center; }
        .auth-card { 
            background: rgba(255, 255, 255, 0.05); 
            -webkit-backdrop-filter: blur(10px); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 16px; 
            padding: 30px; 
        }
        .nav-pills .nav-link { color: #94a3b8; font-weight: 600; }
        .nav-pills .nav-link.active { background-color: #3b82f6; }
        .form-control { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: white; }
        .form-control:focus { background: rgba(255,255,255,0.15); color: white; border-color: #3b82f6; box-shadow: none; }
        .form-control::placeholder { color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold"><i class="fa-solid fa-bolt text-warning me-2"></i>Queue Killer</h2>
                    <p class="text-secondary">AI Automated Slot & Registration Platform</p>
                </div>
                
                <div class="auth-card shadow-lg">
                    <ul class="nav nav-pills nav-justified mb-4" id="pills-tab">
                        <li class="nav-item">
                            <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-panel" type="button">Login</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-panel" type="button">Sign Up</button>
                        </li>
                    </ul>

                    <div class="tab-content" id="pills-tabContent">
                        <!-- LOGIN FORM -->
                        <div class="tab-pane fade show active" id="login-panel">
                            <form action="/auth/login" method="POST">
                                <div class="mb-3">
                                    <label for="loginEmail" class="form-label text-light">Email Address</label>
                                    <input type="email" id="loginEmail" name="email" class="form-control" placeholder="user@example.com" required>
                                </div>
                                <div class="mb-3">
                                    <label for="loginPassword" class="form-label text-light">Password</label>
                                    <input type="password" id="loginPassword" name="password" class="form-control" placeholder="••••••••" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2">Login to App</button>
                            </form>
                        </div>

                        <!-- SIGNUP FORM -->
                        <div class="tab-pane fade" id="register-panel">
                            <form action="/auth/register" method="POST">
                                <div class="mb-3">
                                    <label for="regName" class="form-label text-light">Full Name</label>
                                    <input type="text" id="regName" name="name" class="form-control" placeholder="Ramesh Patel" required>
                                </div>
                                <div class="mb-3">
                                    <label for="regEmail" class="form-label text-light">Email Address</label>
                                    <input type="email" id="regEmail" name="email" class="form-control" placeholder="user@example.com" required>
                                </div>
                                <div class="mb-3">
                                    <label for="regPhone" class="form-label text-light">Mobile Number</label>
                                    <input type="tel" id="regPhone" name="phone" class="form-control" placeholder="9876543210" required>
                                </div>
                                <div class="mb-3">
                                    <label for="regPassword" class="form-label text-light">Password</label>
                                    <input type="password" id="regPassword" name="password" class="form-control" placeholder="••••••••" required>
                                </div>
                                <button type="submit" class="btn btn-success w-100 fw-bold py-2 mt-2">Create Account</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
