{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-5">
        <div class="mb-3 text-start">
            <a href="/" class="btn btn-outline-glass btn-sm"><i class="fa-solid fa-arrow-left me-2"></i>Back to Home</a>
        </div>
        
        <div class="glass-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="fs-2 text-warning mb-2"><i class="fa-solid fa-bolt"></i></div>
                <h3 class="fw-bold m-0">Queue Killer AI</h3>
                <small class="text-slate-400">Automated Govt Service Portal</small>
            </div>

            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label text-slate-300 small">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-slate-300 small">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-gradient w-100 py-3 fw-bold">Sign In</button>
            </form>
            <div class="text-center mt-3">
                <small class="text-slate-400">Don't have an account? <a href="/signup" class="text-info text-decoration-none fw-semibold">Sign Up</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
